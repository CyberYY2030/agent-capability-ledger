name: privacy-gate

on:
  workflow_dispatch:
  pull_request:

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/test_entrypoint.py tests/test_public_content_contract.py tests/test_privacy.py::PrivacyTreeTests tests/test_privacy.py::PrivacyGitTests tests/test_privacy.py::RuleContractTests -q
      - name: Candidate tree
        run: python -m agent_core.privacy --tree . --strict
      - name: Reachable Git history
        run: python -m agent_core.privacy --git-repo . --strict
