name: privacy-gate

on:
  workflow_dispatch:
  pull_request:

jobs:
  privacy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Shell format
        run: python templates/check_shell_format.py install.sh runtimes/generic/user_prompt.sh
      - name: Candidate tree
        run: python -m agent_core.privacy --tree . --publication --strict
      - name: Reachable Git history
        run: python -m agent_core.privacy --git-repo . --publication --strict
